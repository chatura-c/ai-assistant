name: build app
on:
  push:
    branches:
      - ci

jobs:
  package:
    name: build ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
          - os: macos-latest
            platform: macOS
          - os: windows-latest
            platform: windows

    steps:
      - uses: actions/checkout@v4

      - name: set up python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: install briefcase
        run: |
          python -m pip install --upgrade pip
          python -m pip install briefcase

      - name: install linux dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libpyside6-dev libegl1-mesa

      - name: briefcase package
        run: briefcase package

      - name: upload installer
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.platform }}-installer
          path: |
            dist/*.msi
            dist/*.dmg
            dist/*.AppImage
